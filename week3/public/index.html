<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Story Explorer - SIT 725</title>

    <meta name="description"
        content="SIT 725 Practical 3 Story Explorer">

    <!-- Materialize CSS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

    <!-- Navigation -->
    <nav>
        <div class="nav-wrapper navbar-size">

            <a href="#" class="brand-logo">
                Story Explorer
            </a>

            <ul id="nav-mobile"
                class="right hide-on-med-and-down">

                <li>
                    <a href="https://github.com/"
                        target="_blank">
                        GitHub
                    </a>
                </li>

            </ul>

        </div>
    </nav>


    <!-- Main Content -->
    <main class="main-body">

        <div class="container">

            <!-- Heading -->
            <div class="row">

                <div class="col s12 center-align">

                    <h1 id="heading">
                        Welcome to Story Explorer
                    </h1>

                    <p class="flow-text">
                        Discover books from our collection
                    </p>

                </div>

            </div>


            <!-- Image -->
            <div class="row">

                <div class="col s12 center-align">

                    <img
                        class="materialboxed materialboxed-image"
                        src="images/book4.jpg"
                        alt="Featured book">

                </div>

            </div>


            <!-- Button -->
            <div class="row">

                <div class="col s12 center-align">

                    <a
                        class="waves-effect waves-light btn click-me-button"
                        id="clickMeButton">

                        <i class="material-icons left">
                            auto_stories
                        </i>

                        Explore Books

                    </a>

                </div>

            </div>


            <!-- Dynamic Cards -->
            <div class="row" id="card-section">

            </div>

        </div>

    </main>


    <!-- jQuery -->
    <script
        src="https://code.jquery.com/jquery-3.6.0.min.js">
    </script>

    <!-- Materialize JavaScript -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js">
    </script>

    <!-- Custom JavaScript -->
    <script src="js/scripts.js"></script>

</body>

</html>
